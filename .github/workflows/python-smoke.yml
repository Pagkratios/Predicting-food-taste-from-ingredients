name: Python Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/mplconfig
      LOKY_MAX_CPU_COUNT: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: Lasso/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -r Lasso/requirements.txt

      - name: Prepare matplotlib cache
        run: mkdir -p "$MPLCONFIGDIR"

      - name: Run preprocess
        run: python Lasso/src/preprocess.py

      - name: Run data plots
        run: python Lasso/src/data_plots.py

      - name: Run training
        run: python Lasso/src/train.py
